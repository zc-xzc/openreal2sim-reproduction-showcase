name: CPU harness checks (not GPU reproduction)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Install synthetic-test dependency
        run: python -m pip install numpy==1.26.3
      - name: Unit tests and local integrity
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_repository.py
          python scripts/verify_distribution.py
          bash -n scripts/checkout_upstream.sh
          python scripts/repro.py run --root /not-used --key demo_image --stage preprocess
